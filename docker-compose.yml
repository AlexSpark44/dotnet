version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: branch_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./ops/otel-config.yaml:/etc/otel-config.yaml
    ports: ["4317:4317", "4318:4318"]

  api:
    build:
      context: .
      dockerfile: src/Branch.Platform.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=branch_platform;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Authentication__Authority: https://your-oidc-provider
      Authentication__Audience: branch-platform-api
    depends_on:
      - postgres
      - redis
      - otel-collector
    ports: ["8080:8080"]
