version: "3.9"
services:
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=branch_platform;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Authentication__Authority: https://your-oidc-provider
      Authentication__Audience: branch-platform-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: dotnet Branch.Platform.Worker.dll
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=branch_platform;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: branch_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
