name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: platform
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Branch.Platform.sln

      - name: Build
        run: dotnet build Branch.Platform.sln -c Release --no-restore

      - name: Test (with coverage)
        run: |
          dotnet test Branch.Platform.sln -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results + coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*
